name: Deploy

# Runs after CI finishes on main (and only deploys if CI passed),
# or manually via the "Run workflow" button in the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # request the GitHub OIDC token used to log in to AWS
  contents: read

# One deploy at a time; never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only when:
    #  - someone clicked "Run workflow" (the role's trust policy limits that to main), or
    #  - CI passed for a PUSH to main in THIS repo. `branches: [main]` above matches the
    #    branch *name* only, so without these checks a pull request from a fork whose
    #    branch is called "main" could get its code deployed with our AWS role.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false # deploy never pushes to git

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy with CDK
        working-directory: infra
        env:
          HOSTED_ZONE_ID: ${{ vars.APPBEP_HOSTED_ZONE_ID }}
        run: npx cdk deploy -c "hostedZoneId=$HOSTED_ZONE_ID" --require-approval never
